services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: marel_backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 20

  # Marel storefront → SOFTRADE_API_URL=http://localhost:8081/api/v1
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - .:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: MarelBackend
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8081
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: marel_backend
      DB_USERNAME: postgres
      DB_PASSWORD: "123"
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3005,http://localhost:3006,http://127.0.0.1:3000"
      SANCTUM_STATEFUL_DOMAINS: "localhost:3000,localhost:3001,localhost:3002,localhost:3005,localhost:3006,127.0.0.1:3000"
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr

volumes:
  pgdata:
  backend_vendor:
